<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background-color: #121214;
      color: #f3f4f6;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .badge {
      width: 32px;
      height: 32px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      font-size: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f3f4f6;
      margin: 0;
    }
    .site-status {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 14px;
    }
    .status-active {
      color: #10b981;
      font-weight: 600;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .btn-report-fake {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-report-fake:hover {
      background-color: rgba(239, 68, 68, 0.25);
    }
    .btn-report-safe {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .btn-report-safe:hover {
      background-color: rgba(16, 185, 129, 0.25);
    }
    .divider {
      height: 1px;
      background-color: #2d2d32;
      margin: 12px 0;
    }
    .btn-dashboard {
      background: transparent;
      color: #818cf8;
      border: 1px dashed #3730a3;
    }
    .btn-dashboard:hover {
      background-color: rgba(99, 102, 241, 0.1);
    }
    .toast {
      display: none;
      font-size: 11px;
      text-align: center;
      color: #10b981;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">🛡️</div>
    <div>
      <h4 class="title">WebSleuth AI</h4>
    </div>
  </div>

  <p class="site-status">Current Status: <span class="status-active">No Threat Detected</span></p>

  <div class="actions">
    <button id="report-fake-btn" class="btn btn-report-fake">
      ⚠️ Report Site as Fake
    </button>
    <button id="report-safe-btn" class="btn btn-report-safe">
      ✅ Report Site as Safe
    </button>
  </div>

  <div class="divider"></div>

  <button id="dashboard-btn" class="btn btn-dashboard">
    📊 Open WebSleuth AI Dashboard
  </button>

  <div id="toast" class="toast">Feedback submitted! Thank you.</div>

  <script src="popup.js"></script>
</body>
</html>
